<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NS Solver</title>
    <meta name="description" content="High-fidelity 2D incompressible Navier-Stokes solver with LBM and projection methods">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Scenario Bar (top) -->
    <div id="scenario-bar" class="scenario-bar"></div>

    <!-- Left Sidebar -->
    <aside id="sidebar" class="sidebar">
        <div class="sidebar-header">
            <button id="sidebar-toggle" class="sidebar-toggle" title="Toggle Sidebar [Tab]">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                    <rect x="1" y="3" width="14" height="2" rx="1" fill="currentColor"/>
                    <rect x="1" y="7" width="14" height="2" rx="1" fill="currentColor"/>
                    <rect x="1" y="11" width="14" height="2" rx="1" fill="currentColor"/>
                </svg>
            </button>
            <span class="sidebar-title">NS Solver</span>
        </div>
        <div class="sidebar-scroll">
            <div id="sidebar-content" class="sidebar-content"></div>
        </div>
    </aside>

    <!-- Main Canvas Area -->
    <main id="canvas-container" class="canvas-container">
        <canvas id="flow-canvas"></canvas>
        <canvas id="overlay-canvas"></canvas>
        <div id="probe-tooltip" class="probe-tooltip hidden"></div>
    </main>

    <!-- Property Monitor (bottom right) -->
    <div id="monitor" class="monitor collapsed">
        <div id="monitor-toggle" class="monitor-header">
            <span>Property Monitor</span>
            <span class="monitor-key">[M]</span>
        </div>
        <div id="monitor-content" class="monitor-content"></div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
